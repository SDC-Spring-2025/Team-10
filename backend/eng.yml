language: eng # As accepted by pytesseract, e.g. "eng+deu"

# Sum keys roughly ordered by likelyhood.
sum_keys:
  - total
  - amount due
  - total due
  - balance due
  - amount to pay
  - total amount
  - amount
  - grand total
  - subtotal
  - total before tip
  - total after tax

formats:
  sum: '\b(?:total|amount|due|balance)?\s*[:\-]?\s*\$?\d{1,5}(?:\.\d{2})\b'

  # Matches dates like 19.08.15 and 19. 08. 2015
  date: '\b([0123]?\d\s?\.\s?[01]?\d\s?\.\s?(?:20)?\d\d)\b'

  postal_code: '\b(\d{5})\s+[a-z]'
